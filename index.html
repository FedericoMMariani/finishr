<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finishr</title>
<meta name="theme-color" content="#EADCC2">
<meta name="description" content="Campionato a punti delle gare di paese: registra le corse, accumula punti, scala la classifica con la tua squadra.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finishr">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#171512;--g2:#DCCAA9;--g3:#DCCAA9;--gl:#F3EADB;--o:#B5482B;--sand:#EADCC2;--ink:#171512;--mut:#6E6556;--line:#E9E1D3;--bg:#F7F3EC;--card:#FFFDF9;--bad:#B91C1C;--warn:#B45309}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
h1,h2,h3,.num{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:0;font-weight:700}
h1{font-size:32px;line-height:1.05;margin:0}h2{font-size:23px;margin:0 0 8px}h3{font-size:20px;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:0 14px 96px}
.top{padding-top:calc(20px + env(safe-area-inset-top))!important}
.top{background:var(--sand);color:var(--ink);padding:20px 16px 18px;margin:0 -14px 14px;display:flex;flex-direction:column;gap:12px}
.top .sub{color:var(--mut);font-size:13px}
.top .pill{background:#DCCAA9;color:var(--ink)}
.pbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.pb{background:var(--gl);border-radius:12px;padding:10px 12px}.pb span{display:block;font-size:12px;color:var(--mut);font-weight:600}.pb b{display:block;font-size:30px;line-height:1.1}.pb small{color:var(--mut);font-size:12px}
img.av{display:block;flex-shrink:0}
textarea{width:100%;min-height:84px;border:1px solid #DCCFB8;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);resize:vertical}
.bio{margin-top:10px;font-size:14px;line-height:1.45;white-space:pre-line;color:var(--ink)}.bio a{color:var(--o);font-weight:600}
.brand{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;letter-spacing:.08em;font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hint{color:var(--mut);font-size:13px;margin:4px 0 10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],input[type=password]{width:100%;height:48px;border:1px solid #DCCFB8;border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 input{text-align:center;font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:28px}
.unit{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#EFE6D6;padding:4px;border-radius:12px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex-shrink:0;height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCCFB8;background:var(--card);font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.btn{min-height:50px;border-radius:14px;border:0;background:var(--o);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:0 16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:var(--card);color:var(--g);border:2px solid var(--g)}
.btn.dark{background:var(--g)}
.btn.link{background:transparent;color:var(--g);min-height:44px;width:auto;padding:0 6px;font-weight:600;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);min-height:44px;font-weight:600;font-size:15px}
.btn:disabled{background:#E2D8C6;color:var(--mut);cursor:not-allowed;border-color:#E2D8C6}
.stack{display:flex;flex-direction:column;gap:8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px;width:100%;background:var(--card);border-left:0;border-right:0;border-top:0;font:inherit;color:var(--ink);text-align:left;text-decoration:none}
.item:last-child{border-bottom:0}
button.item,a.item{cursor:pointer}
.item.me{background:var(--gl)}
.item.out{background:#F4EEE3;opacity:.75}
.pos{width:28px;font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-size:19px;color:var(--o);flex-shrink:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow b{font-size:15px;font-weight:600}
.grow small,.sm{font-size:12px;color:var(--mut)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.right b{font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.g{background:#E1ECD6;color:#2F5326}.pill.o{background:#F5DED5;color:#8A3220}.pill.n{background:#ECE5D8;color:#4A4336}.pill.r{background:#FEE2E2;color:#991B1B}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--g2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:30px;font-weight:700;line-height:1}.stat span{font-size:12px;color:var(--mut)}
.big{font-size:62px;font-weight:700;line-height:.95}
.banner{display:flex;gap:10px;align-items:center;background:var(--g3);border-radius:14px;padding:10px 12px;font-size:13px}
.note{background:#FFF7ED;border:1px solid #FED7AA;color:#7C2D12;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.okbox{background:var(--gl);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;color:var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border:2px dashed #BFAE8D;border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:#FBF7F0;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.checks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.ic{width:22px;height:22px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.ic.ok{background:#15803D}.ic.ko{background:var(--bad)}.ic.wa{background:var(--warn)}.ic.in{background:#6B7280}
.checks b{display:block;font-size:14px}.checks small{color:var(--mut);font-size:13px}
.track{width:100%;height:140px;background:#F3EADB;border-radius:14px;display:block;margin-top:10px}
.shot{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:10px auto 0;border:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:#E2D8C6;overflow:hidden;margin-top:8px}.bar>div{height:8px;background:var(--g)}
table.pts{width:100%;border-collapse:collapse}
table.pts td{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
table.pts td:last-child{text-align:right;font-weight:700;padding-left:8px;white-space:nowrap}
table.pts small{display:block;color:var(--mut);font-size:12px}
.total{background:var(--g);color:#fff;border-radius:16px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.total .num{font-size:44px;font-weight:700}
.av{width:38px;height:38px;border-radius:19px;background:#E5D8BF;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.shield{width:48px;height:54px;border-radius:9px 9px 24px 24px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;font-family:'Barlow Condensed',Inter,sans-serif}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:500}
nav.tabs a{position:relative}
nav.tabs a[aria-current=page]{color:var(--o);font-weight:700}
nav.tabs a[aria-current=page] svg{fill:color-mix(in srgb,currentColor 12%,transparent)}
nav.tabs a[aria-current=page]::after{content:'';position:absolute;bottom:-4px;width:18px;height:3px;border-radius:2px;background:currentColor}
.sheet{position:fixed;inset:0;background:rgba(23,21,18,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.sheet .panel{background:var(--card);border-radius:22px 22px 0 0;padding:14px 18px 28px;max-height:88vh;overflow:auto;max-width:560px;width:100%;margin:0 auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:20}
.toast.on{opacity:1}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 16px}
.radio{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid #DCCFB8;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.radio[aria-checked=true]{border:2px solid var(--g);background:var(--gl);padding:11px 13px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:42px;height:42px;border-radius:21px;cursor:pointer;border:3px solid transparent}
.swatches button[aria-checked=true]{border-color:#fff;box-shadow:0 0 0 3px var(--ink)}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:120px}
.chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:120px}
.chart i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--g)}
.chart span{font-size:10px;color:var(--mut)}
.chart em{font-size:9px;font-style:normal;color:#4A4336;font-weight:700}
.hidden{display:none!important}
a{color:var(--o)}
.code{font-family:'Barlow Condensed',Inter,sans-serif;font-size:34px;font-weight:700;letter-spacing:.12em}
</style>
</head>
<body>
<div class="app">
<main id="main"><div class="center"><p class="hint">Caricamento…</p></div></main>
<nav class="tabs hidden" id="tabs" aria-label="Navigazione principale">
<a href="#home" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
<a href="#registra" data-tab="registra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>Registra</a>
<a href="#classifiche" data-tab="classifiche"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V10h6v11"/><path d="M3 21v-6h6"/><path d="M15 21v-8h6v8"/><path d="M2 21h20"/><path d="M12 3.5l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 5.6l2-.3z"/></svg>Classifiche</a>
<a href="#squadra" data-tab="squadra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.3 7.8-8 9-4.7-1.2-8-4.5-8-9V6z"/><path d="M9 11.5l2 2 4-4"/></svg>Squadra</a>
<a href="#profilo" data-tab="profilo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profilo</a>
</nav>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
